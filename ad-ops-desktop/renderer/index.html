<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad ops — suivi opérationnel</title>
<style>
:root{--ink:#141A2B;--ink2:#525C73;--ink3:#8C95A8;--page:#F0F1F5;--surf:#fff;--soft:#F7F8FB;--line:#DEE1E9;--bar:#151B2E;--blue:#2743F0;--red:#C33A2E;--amber:#B26A00;--green:#1B7A5A}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 "Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surf);border:1px solid var(--line);color:var(--ink2);border-radius:7px;padding:7px 13px;transition:.12s}
button:hover:not(:disabled){border-color:#C3C9D6;color:var(--ink)}
button:disabled{opacity:.42;cursor:default}
button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
button.prim{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500;padding:8px 15px}
button.prim:hover{filter:brightness(1.07);color:#fff}
button.del{margin-left:auto;color:var(--red)}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#C7CCD8;border-radius:9px;border:3px solid transparent;background-clip:content-box}

#top{background:var(--bar);color:#fff}
#top .in{max-width:1240px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;gap:22px}
#brand{font-weight:700;letter-spacing:-.02em;font-size:15px}
#nav{display:flex;gap:4px;height:100%}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:#9BA3B6;font-size:13.5px;padding:0 12px;height:100%}
.tab:hover{color:#fff;border-color:transparent}
.tab.on{color:#fff;font-weight:600;border-bottom-color:var(--ac)}
#tools-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#7E879C}
#tools-right button{background:transparent;border-color:#333C54;color:#B9C0CE;padding:5px 10px;font-size:12px}
#tools-right button:hover{color:#fff;border-color:#4B5570}

#wrap{max-width:1240px;margin:0 auto;padding:26px 20px 64px}
#head h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0}
.rule{height:3px;width:38px;border-radius:2px;margin:7px 0 20px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(20,26,43,.04);overflow:hidden}
.card.pad{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.num{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--ink3)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools select,.tools input{width:auto;min-width:130px}
.tools input[data-set=q]{flex:1 1 160px;max-width:250px}
.seg{margin-left:auto;display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:none;padding:6px 12px;border-radius:6px;background:transparent}
.note{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.note i{font-style:italic}

.scroll{overflow:auto;max-height:640px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--soft);border-bottom:1px solid var(--line);text-align:left;font-weight:500;font-size:12px;color:var(--ink2);padding:9px 12px;white-space:nowrap;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.b{font-weight:500;max-width:420px;overflow:hidden;text-overflow:ellipsis}
td.m{color:var(--ink2)}td.n{font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.dash{color:var(--ink3)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{color:var(--green);background:#1B7A5A16;border:1px solid #1B7A5A28}
.pill.no{color:var(--red);background:#C33A2E16;border:1px solid #C33A2E28}
.pill.na{color:var(--ink3);background:#8C95A816;border:1px solid #8C95A828}
.pager{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:12px;color:var(--ink2);background:var(--soft);font-variant-numeric:tabular-nums}
.pager button{padding:4px 10px}
.grow{flex:1}

.row{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line);border-left:3px solid var(--line);cursor:pointer}
.card > .row:first-child{border-top:none}
.row:hover{background:var(--soft)}
.row .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .al{font-size:13px;color:var(--ink2);margin-top:3px}
.rt{text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt b{color:var(--ink)}
.prog{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:5px;color:var(--ink3)}
.bar{height:4px;width:64px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch b.s,b.s{font-size:13.5px}
.mini{padding:9px 10px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:7px;margin-bottom:7px;cursor:pointer}
.mini:hover{background:var(--soft)}
.mini .ttl{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .sub{margin:2px 0 5px}
.empty{padding:48px 24px;text-align:center;color:var(--ink2)}
.empty .big{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:6px}
.empty p{max-width:460px;margin:0 auto 18px}
.foot{color:var(--ink3);font-size:12px;margin-top:14px}

.ov{position:fixed;inset:0;background:rgba(20,26,43,.4);display:flex;justify-content:flex-end;z-index:30}
.ov.mid{align-items:center;justify-content:center;padding:20px}
.ov aside{background:var(--surf);width:min(540px,100%);height:100%;overflow-y:auto;padding:24px}
.ov aside.sm{width:min(440px,100%)}
.ov section{background:var(--surf);border-radius:10px;width:min(720px,100%);max-height:90%;overflow-y:auto;padding:22px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ov h2{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:8px 0 4px;word-break:break-word}
.sep{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
dl{display:grid;grid-template-columns:116px 1fr;row-gap:9px;column-gap:12px;font-size:13px;margin:0}
dt{color:var(--ink3);padding-top:7px}dd{margin:0}
.mt{margin-top:14px}
.box{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-top:18px}
.box.soft{background:var(--soft);margin:14px 0}
.step{font-size:17px;font-weight:600;letter-spacing:-.02em}
.chk{display:flex;gap:9px;align-items:center;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--blue);flex:0 0 auto}
.ind{padding-left:24px;margin-top:6px}
.lp{margin-bottom:8px}
.fx{display:flex;gap:6px}
.fx button{padding:6px 10px}
.prev{margin-top:5px;font-size:11.5px;color:var(--ink2);background:var(--soft)}
.alert{border-left:3px solid;padding:7px 11px;margin-bottom:8px;background:var(--soft);border-radius:0 6px 6px 0}
.gate{border-left:3px solid var(--line);padding:9px 0 9px 11px;margin-bottom:6px;border-radius:0 6px 6px 0}
.gate.next{border-left-color:var(--blue);background:var(--soft)}
.gate.done{border-left-color:var(--green)}
.gate.done .gl{color:var(--ink3);text-decoration:line-through}
.gate.next .gl{font-weight:600}
.gate .chk .sub{margin-left:auto;padding-right:4px;white-space:nowrap}
.gate textarea{margin-top:6px;font-size:12.5px;background:#FBFCFD}
.n{font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surf);padding-top:12px;border-top:1px solid var(--line)}
.ov section .acts{position:static;border:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
@media(max-width:640px){#wrap{padding:18px 12px 48px}dl{grid-template-columns:1fr}dt{padding-top:2px}}

/* sécurité */
.lock{min-height:80vh;display:flex;align-items:center;justify-content:center}
.lockbox{padding:32px;width:min(360px,100%);text-align:center}
.lockbox .lk{font-size:26px}
.lockbox h2{margin:8px 0 4px;font-size:19px;letter-spacing:-.02em}
.lockbox input{margin:16px 0 10px;text-align:center;letter-spacing:.15em}
.lockbox button{width:100%}
.err{color:var(--red);font-size:12.5px;margin-bottom:10px}
.secrow{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.secrow.col{display:block}
.secrow b{font-size:13.5px}
.secrow .sub{margin-top:3px;max-width:430px}
.secrow > div:first-child{flex:1}
.fx.sb{justify-content:space-between;align-items:center}
.snaps{max-height:190px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:7px}
.snap{display:flex;gap:10px;align-items:center;padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
.snap:last-child{border-bottom:none}
.snap .sub{margin-left:auto}
.snap button{padding:3px 9px;font-size:12px}

</style>
</head>

</div></div>
<div id="wrap"><div id="head"></div><div id="main"></div></div>
<div id="drawer"></div>

/* ===================== Coffre local : IndexedDB + miroir localStorage + chiffrement ===================== */
const IDB = (() => {
  let db = null;
  const ready = new Promise((res) => {
    if (!window.indexedDB) return res(null);
    const r = indexedDB.open("adops-db", 2);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv", { keyPath: "k" }); };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => res(null);
  });
  return {
    async get(k) {
      await ready;
      if (!db) return null;
      return new Promise((res) => { const rq = db.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result ? rq.result.v : null); rq.onerror = () => res(null); });
    },
    async set(k, v) {
      await ready;
      if (!db) return false;
      return new Promise((res) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put({ k, v }); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    },
    async del(k) { await ready; if (!db) return; const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); },
  };
})();

const ENC = new TextEncoder(), DEC = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)).buffer;
async function deriveKey(pass, salt) {
  const km = await crypto.subtle.importKey("raw", ENC.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: new Uint8Array(salt), iterations: 250000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptVal(key, v) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, ENC.encode(JSON.stringify(v)));
  return { e: 1, iv: Array.from(iv), ct: b64(ct) };
}
async function decryptVal(key, p) {
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(p.iv) }, key, unb64(p.ct));
  return JSON.parse(DEC.decode(buf));
}

const DESKTOP = typeof window !== "undefined" && !!window.desktop;

const Vault = {
  key: null, meta: null,
  async raw(k) {
    if (DESKTOP) return window.desktop.get(k);
    let v = await IDB.get(k);
    if (v == null) { const s = localStorage.getItem("adops_" + k); v = s ? JSON.parse(s) : null; }
    return v;
  },
  async get(k) {
    const v = await this.raw(k);
    if (v && v.e) { if (!this.key) throw new Error("locked"); return decryptVal(this.key, v); }
    return v;
  },
  /* double écriture : la donnée survit à la perte d'un des deux magasins */
  async set(k, v) {
    const payload = this.key ? await encryptVal(this.key, v) : v;
    if (DESKTOP) return window.desktop.set(k, payload);
    const ok = await IDB.set(k, payload);
    try { localStorage.setItem("adops_" + k, JSON.stringify(payload)); } catch (e) { /* quota */ }
    return ok;
  },
};

/* --- sauvegarde automatique dans un dossier du poste (OneDrive, disque réseau…) --- */
const Backup = {
  dir: null, lastDay: null,
  async init() {
    if (DESKTOP) { const p = await window.desktop.paths(); this.dirLabel = p.backup; state.backup = p.backup ? "actif" : "non configuré"; state.dataPath = p.data; return; }
    this.dir = await IDB.get("backupDir");
    this.lastDay = localStorage.getItem("adops_lastBackupDay");
    if (this.dir) { const p = await this.dir.queryPermission({ mode: "readwrite" }); state.backup = p === "granted" ? "actif" : "à réautoriser"; }
    else state.backup = window.showDirectoryPicker ? "non configuré" : "non disponible";
  },
  async choose() {
    if (DESKTOP) { const d = await window.desktop.chooseBackup(); this.dirLabel = d; state.backup = d ? "actif" : "non configuré"; if (d) await this.write(true); return render(); }
    if (!window.showDirectoryPicker) return alert("Ce navigateur ne permet pas la sauvegarde automatique dans un dossier. Utilisez le bouton Sauvegarder.");
    try {
      this.dir = await window.showDirectoryPicker({ mode: "readwrite" });
      await IDB.set("backupDir", this.dir);
      state.backup = "actif"; await this.write(true); render();
    } catch (e) { /* annulé */ }
  },
  async grant() { if (!this.dir) return; const p = await this.dir.requestPermission({ mode: "readwrite" }); state.backup = p === "granted" ? "actif" : "refusé"; render(); },
  async write(force) {
    if (DESKTOP) {
      const r = await window.desktop.writeBackup(JSON.stringify(exportObj(), null, 1), !!force);
      if (r && String(r).startsWith("ERR:")) { state.backup = "échec d'écriture"; return; }
      if (r) { state.backup = "actif"; state.saved = "enregistré + sauvegardé " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); paintStatus(); }
      return;
    }
    if (!this.dir) return;
    if ((await this.dir.queryPermission({ mode: "readwrite" })) !== "granted") { state.backup = "à réautoriser"; return; }
    const payload = JSON.stringify(exportObj(), null, 1);
    const put = async (name) => { const fh = await this.dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(payload); await w.close(); };
    try {
      await put("adops-sauvegarde.json");
      const d = todayISO();
      if (force || this.lastDay !== d) { await put("adops-sauvegarde-" + d + ".json"); this.lastDay = d; localStorage.setItem("adops_lastBackupDay", d); }
      state.backup = "actif"; state.saved = "enregistré + sauvegardé " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      paintStatus();
    } catch (e) { state.backup = "échec d'écriture"; }
  },
};
const exportObj = () => ({ v: 2, date: new Date().toISOString(), campaigns: state.campaigns, adserver: state.adserver, adverif: state.adverif });

let idleTimer = null;
function armIdle() {
  if (!Vault.meta || !Vault.meta.enc) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { Vault.key = null; state.locked = true; state.drawer = null; state.imp = null; render(); }, 15 * 60 * 1000);
}
["click", "keydown"].forEach((ev) => document.addEventListener(ev, armIdle, true));

async function setPasscode(pass) {
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)));
  const key = await deriveKey(pass, salt);
  Vault.key = key;
  Vault.meta = { enc: true, salt, check: await encryptVal(key, "ok") };
  await IDB.set("meta", Vault.meta);
  localStorage.setItem("adops_meta", JSON.stringify(Vault.meta));
  await Promise.all([Vault.set("campaigns", state.campaigns), Vault.set("ref_adserver", state.adserver), Vault.set("ref_adverif", state.adverif), Vault.set("snapshots", [])]);
}
async function removePasscode() {
  Vault.key = null; Vault.meta = { enc: false };
  await IDB.set("meta", Vault.meta);
  localStorage.setItem("adops_meta", JSON.stringify(Vault.meta));
  await Promise.all([Vault.set("campaigns", state.campaigns), Vault.set("ref_adserver", state.adserver), Vault.set("ref_adverif", state.adverif), Vault.set("snapshots", [])]);
}
async function unlock(pass) {
  try {
    const key = await deriveKey(pass, Vault.meta.salt);
    await decryptVal(key, Vault.meta.check);
    Vault.key = key; state.locked = false; armIdle();
    await loadAll();
    return true;
  } catch (e) { return false; }
}

const DAY = 864e5;

const fmtD = (s) => { const d = parseD(s); return d ? d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "2-digit" }) : "—"; };

  const qs = UTM_KEYS.filter(([f]) => utm && utm[f]).map(([f, p]) => p + "=" + encodeURIComponent(utm[f])).join("&");
  return qs ? url + (url.indexOf("?") >= 0 ? "&" : "?") + qs : url;
};

function alertsFor(c) {

  const d1 = parseD(c.d1), d2 = parseD(c.d2), g = nextGate(c), s = c.s;
  const notLive = ["En ligne", "MEL en cours", "Finie - en attente BDD", "A réconcilier", "Réconciliée", "Terminée"].indexOf(s) < 0;
  if (d2 && s === "En ligne" && d2 < T0) a.push({ lvl: 2, r: "Fin dépassée", t: "Fin le " + fmtD(c.d2) + " — cocher « " + (g ? g.l : "clôture") + " » pour clôturer" });
  if (d1 && notLive && d1 < T0) a.push({ lvl: 2, r: "Départ dépassé", t: "Départ le " + fmtD(c.d1) + " et encours bloquant : " + (g ? g.l : "—") });
  if (d1 && notLive && d1 >= T0 && diffD(d1, T0) <= 7) a.push({ lvl: 1, r: "J-" + diffD(d1, T0), t: "Encours à traiter avant départ : " + (g ? g.l : "—") });

  if (s === "Finie - en attente BDD" && d2 && diffD(T0, d2) > 15) a.push({ lvl: 1, r: "BDD", t: "Bilan de diffusion attendu depuis " + diffD(T0, d2) + " j" });

/* --- import --- */
const noAcc = (v) => String(v == null ? "" : v).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const MONTHS = { jan: 1, feb: 2, fev: 2, mar: 3, apr: 4, avr: 4, may: 5, mai: 5, jun: 6, juin: 6, jul: 7, juil: 7, aug: 8, aou: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function toISO(v) {
  const x = String(v || "").trim();
  if (!x || /^(null|n\/a|tbc)$/i.test(x)) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(x)) return x.slice(0, 10);
  let m = x.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);
  if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  m = noAcc(x).match(/^(\d{1,2})\s+([a-z]{3,5})\.?\s+(\d{4})$/);
  if (m && MONTHS[m[2].slice(0, 3)]) return m[3] + "-" + String(MONTHS[m[2].slice(0, 3)]).padStart(2, "0") + "-" + m[1].padStart(2, "0");
  return "";
}
function splitLine(line, d) {
  if (d !== ",") return line.split(d);
  const out = []; let cur = "", q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur); cur = ""; } else cur += ch; }
  out.push(cur); return out;
}
function parseTable(text, cols) {
  const lines = text.trim().split(/\r?\n/).filter((l) => l.trim());
  if (lines.length < 2) return { rows: [], mapped: [], missing: cols.map((c) => c.l) };
  const d = ["\t", ";", ","].map((x) => [x, lines[0].split(x).length]).sort((a, b) => b[1] - a[1])[0][0];
  const head = splitLine(lines[0], d).map((h) => noAcc(h.replace(/"/g, "")));
  const idx = {}, mapped = [], missing = [];
  cols.forEach((c) => {
    const i = head.findIndex((h) => h && (c.syn || []).some((sy) => h.indexOf(sy) >= 0));
    if (i >= 0) { idx[c.k] = i; mapped.push(c.l); } else missing.push(c.l);
  });
  const clean = (v) => String(v == null ? "" : v).replace(/^"|"$/g, "").trim();
  const tri = (v) => { const x = noAcc(v); return x === "oui" || x === "yes" ? "Oui" : x === "non" || x === "no" ? "Non" : x === "n/a" || x === "na" ? "N/A" : x === "tbc" ? "TBC" : ""; };
  const rows = lines.slice(1).map((l, n) => {
    const cells = splitLine(l, d), o = { uid: "i" + Date.now() + "_" + n };
    cols.forEach((c) => {
      const raw = clean(cells[idx[c.k]]);
      o[c.k] = c.t === "tri" ? tri(raw) : c.t === "date" ? toISO(raw) : /^null$/i.test(raw) ? "" : raw;
    });
    return o;
  }).filter((o) => cols.some((c) => o[c.k]));
  return { rows, mapped, missing };
}
const rowKey = (r, cfg) => cfg.id.map((k) => noAcc(r[k])).join("|");
function mergeRows(existing, incoming, cfg) {
  const map = new Map(existing.map((r) => [rowKey(r, cfg), r]));
  let upd = 0, add = 0, same = 0;
  incoming.forEach((n) => {
    const k = rowKey(n, cfg), old = map.get(k);
    if (!old) { map.set(k, n); add++; return; }
    if (cfg.cols.some((c) => (old[c.k] || "") !== (n[c.k] || ""))) { map.set(k, Object.assign({}, n, { uid: old.uid })); upd++; } else same++;
  });
  return { rows: Array.from(map.values()), upd, add, same };
}
const toCSV = (rows, cols) => [cols.map((c) => c.l).join(";")].concat(rows.map((r) => cols.map((c) => String(r[c.k] || "").replace(/;/g, ",")).join(";"))).join("\n");
function download(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: type || "text/plain;charset=utf-8" }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

async function boot() {

  else try { state.persist = navigator.storage && navigator.storage.persisted ? ((await navigator.storage.persisted()) ? "garanti" : "non garanti") : "inconnu"; } catch (e) { state.persist = "inconnu"; }

    <div class="ch mt"><b>Encours à gérer</b><span class="sub n">${doneN(d)}/${gatesFor(d).length}</span></div>
    ${gatesFor(d).map((gt) => {
      const t = d.tasks[gt.k] || { ok: false, at: null, note: "" }, nx = g && g.k === gt.k;
      return `<div class="gate${t.ok ? " done" : nx ? " next" : ""}">
        <label class="chk"><input type="checkbox" data-gate="${gt.k}"${t.ok ? " checked" : ""}><span class="gl">${esc(gt.l)}</span><span class="sub n">${t.ok ? fmtD(t.at) : esc(gt.step)}</span></label>
        <textarea data-note="${gt.k}" rows="${t.note ? 2 : 1}" placeholder="Commentaire sur cet encours…">${esc(t.note || "")}</textarea></div>`;
    }).join("")}

    <div class="acts"><button class="prim" data-act="savec">Enregistrer</button><button data-close="1">Annuler</button>
    ${isNew ? "" : `<button class="del" data-act="delc">Supprimer</button>`}</div>
  </aside></div>`;
}

/* ---------- Panneau ligne référentiel ---------- */
function drawerRow() {
  const cfg = REFS[state.tab], d = state.draft, isNew = !state[cfg.key].some((r) => r.uid === d.uid);
  return `<div class="ov" data-close="1"><aside class="sm">
    <div class="dh"><b>${isNew ? "Nouvelle ligne" : "Modifier la ligne"}</b><button data-close="1">Fermer</button></div>
    <dl class="mt">${cfg.cols.filter((c) => c.t !== "date").map((c) => `<dt>${c.l}</dt><dd>${c.t === "tri"
      ? `<select data-r="${c.k}">${TRI.map((v) => `<option value="${v}"${(d[c.k] || "") === v ? " selected" : ""}>${v || "—"}</option>`).join("")}</select>`
      : `<input data-r="${c.k}" value="${esc(d[c.k] || "")}">`}</dd>`).join("")}</dl>
    <div class="sub mt">La date de mise à jour est posée automatiquement à l'enregistrement.</div>
    <div class="acts"><button class="prim" style="background:${cfg.accent};border-color:${cfg.accent}" data-act="saver">Enregistrer</button><button data-close="1">Annuler</button>
    ${isNew ? "" : `<button class="del" data-act="delr">Supprimer</button>`}</div>
  </aside></div>`;
}

/* ---------- Import ---------- */
function modalImport() {
  const cfg = REFS[state.tab], res = parseTable(state.imp.text, cfg.cols);
  let diff = "";
  if (state.imp.mode === "merge" && res.rows.length) {
    const m = mergeRows(state[cfg.key], res.rows, cfg);
    diff = `<div class="mt"><b style="color:var(--blue)">${m.upd}</b> ligne(s) modifiée(s) · <b style="color:var(--green)">${m.add}</b> ajoutée(s) · ${m.same} inchangée(s)
      <div class="sub">Rapprochement sur : ${cfg.id.map((k) => cfg.cols.find((c) => c.k === k).l).join(" + ")}</div></div>`;
  }
  return `<div class="ov mid" data-close="1"><section>
    <div class="dh"><b>Importer le référentiel</b><button data-close="1">Fermer</button></div>
    <p class="sub">Collez l'export (Sheets, Looker ou CSV), en-têtes compris. Séparateur détecté automatiquement, colonnes reconnues par leur intitulé.
    <b>Mettre à jour</b> ne touche que ce qui a changé et conserve les lignes absentes de l'export. <b>Remplacer tout</b> repart de zéro. <b>Tout ajouter</b> empile sans contrôle.</p>
    <textarea id="impText" rows="9" class="mono" placeholder="${cfg.cols.map((c) => c.l).join("\t")}">${esc(state.imp.text)}</textarea>
    ${state.imp.text.trim() ? `<div class="sub mt"><b style="color:${res.rows.length ? "var(--green)" : "var(--red)"}">${res.rows.length}</b> ligne(s) détectée(s)<div>Colonnes reconnues : ${res.mapped.join(", ") || "aucune"}</div>${res.missing.length ? `<div style="color:var(--amber)">Non trouvées : ${res.missing.join(", ")}</div>` : ""}${diff}</div>` : ""}
    <div class="acts">${[["merge", "Mettre à jour"], ["replace", "Remplacer tout"], ["append", "Tout ajouter"]].map((m) => `<button data-mode="${m[0]}"${state.imp.mode === m[0] ? ' class="on"' : ""}>${m[1]}</button>`).join("")}
    <button class="prim" data-act="doimport" style="margin-left:auto;background:${cfg.accent};border-color:${cfg.accent}"${res.rows.length ? "" : " disabled"}>${state.imp.mode === "merge" ? "Mettre à jour" : "Importer"} ${res.rows.length || ""}</button></div>
  </section></div>`;
}

function lockScreen() {
  return `<div class="lock"><div class="card lockbox">
    <div class="lk">&#128274;</div><h2>Suivi opérationnel</h2>
    <p class="sub">Données chiffrées sur ce poste. Saisissez votre code d'accès.</p>
    <input id="passIn" type="password" placeholder="Code d'accès" autofocus>
    ${state.lockErr ? `<div class="err">${esc(state.lockErr)}</div>` : ""}
    <button class="prim" data-act="unlock">Déverrouiller</button>
  </div></div>`;
}
function panelSecurite() {
  const on = Vault.meta && Vault.meta.enc;
  return `<div class="ov mid" data-close="1"><section>
    <div class="dh"><b>Sécurité et sauvegarde</b><button data-close="1">Fermer</button></div>

    <div class="secrow"><div><b>Stockage des données</b><div class="sub">${DESKTOP
      ? "Fichiers JSON écrits de façon atomique, avec copie .bak du fichier précédent.<br>" + esc(state.dataPath || "") + ' <button data-act="reveal">Ouvrir le dossier</button>'
      : "Base locale IndexedDB, doublée dans le stockage local. Aucune donnée ne sort du poste."}</div></div>
      <span class="pill ${DESKTOP || state.persist === "garanti" ? "ok" : "na"}">${DESKTOP ? "fichiers" : esc(state.persist)}</span></div>

    <div class="secrow"><div><b>Code d'accès</b><div class="sub">${on ? "Données chiffrées en AES-256 sur le disque. Verrouillage automatique après 15 minutes d'inactivité." : "Sans code, les données sont lisibles par quiconque ouvre ce profil de navigateur."}</div></div>
      ${on ? `<button data-act="delpass">Retirer</button>` : `<button class="prim" data-act="setpass">Définir</button>`}</div>

    <div class="secrow"><div><b>Sauvegarde automatique</b><div class="sub">Choisissez un dossier (OneDrive, disque réseau). Un JSON y est réécrit à chaque enregistrement, plus une copie datée par jour.${DESKTOP && Backup.dirLabel ? "<br>" + esc(Backup.dirLabel) : ""}</div></div>
      <div class="fx"><span class="pill ${state.backup === "actif" ? "ok" : state.backup === "non configuré" || state.backup === "non disponible" ? "na" : "no"}">${esc(state.backup)}</span>
      ${state.backup === "à réautoriser" ? `<button data-act="grantdir">Réautoriser</button>` : `<button data-act="chooseDir">${state.backup === "actif" ? "Changer" : "Choisir"}</button>`}</div></div>

    <div class="secrow col"><div class="fx sb"><b>Versions précédentes</b><span class="sub">${state.snaps.length} version(s) conservée(s)</span></div>
      <div class="snaps">${state.snaps.length ? state.snaps.map((sn, i) => `<div class="snap"><span>${new Date(sn.t).toLocaleString("fr-FR")}</span><span class="sub">${sn.campaigns.length} campagnes · ${sn.adserver.length + sn.adverif.length} lignes</span><button data-snap="${i}">Restaurer</button></div>`).join("") : `<div class="sub">Aucune version encore.</div>`}</div></div>

    <div class="acts"><button data-act="backup">Exporter un fichier de sauvegarde</button><button data-act="restore">Restaurer un fichier</button></div>
  </section></div>`;
}

/* ===================== Événements ===================== */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-tab],[data-view],[data-open],[data-row],[data-act],[data-page],[data-close],[data-mode],[data-dellp]");
  if (!t) return;
  const d = state.draft;

  if (e.target.classList.contains("ov") || (t.dataset.close !== undefined && t.tagName === "BUTTON")) {
    state.drawer = null; state.draft = null; state.imp = null; state.panel = null; return render();
  }
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.f = {}; state.q = ""; state.page = 0; return render(); }
  if (t.dataset.view) { state.view = t.dataset.view; return render(); }
  if (t.dataset.page) { state.page = Math.max(0, state.page + (+t.dataset.page)); return render(); }
  if (t.dataset.open) { state.draft = norm(JSON.parse(JSON.stringify(state.campaigns.find((c) => c.uid === t.dataset.open)))); state.drawer = "campaign"; return render(); }
  if (t.dataset.row) { state.draft = Object.assign({}, state[state.tab].find((r) => r.uid === t.dataset.row)); state.drawer = "row"; return render(); }
  if (t.dataset.mode) { state.imp.mode = t.dataset.mode; return render(); }
  if (t.dataset.snap !== undefined) {
    const sn = state.snaps[+t.dataset.snap];
    if (!confirm("Revenir à la version du " + new Date(sn.t).toLocaleString("fr-FR") + " ? L'état actuel est d'abord conservé comme version.")) return;
    await pushSnapshot();
    state.campaigns = sn.campaigns.map(norm); state.adserver = sn.adserver; state.adverif = sn.adverif;
    await Promise.all([Vault.set("campaigns", state.campaigns), Vault.set("ref_adserver", state.adserver), Vault.set("ref_adverif", state.adverif)]);
    state.snaps = (await Vault.get("snapshots")) || []; state.panel = null; render(); return Backup.write(true);
  }
  if (t.dataset.dellp !== undefined) { d.lps.splice(+t.dataset.dellp, 1); return render(); }

  const cfg = REFS[state.tab];
  switch (t.dataset.act) {
    case "newc": state.draft = norm({ uid: "c" + Date.now(), c: state.client !== "Tous" ? state.client : "", a: "", id: "", d1: "", d2: "", t: "" }); state.drawer = "campaign"; return render();
    case "addlp": d.lps.push({ url: "" }); return render();
    case "savec": {
      const c = Object.assign({}, d); delete c.al; delete c.s;
      state.campaigns = state.campaigns.some((x) => x.uid === c.uid) ? state.campaigns.map((x) => (x.uid === c.uid ? c : x)) : [c].concat(state.campaigns);
      state.drawer = null; state.draft = null; render(); return save("suivi");
    }
    case "delc": if (!confirm("Supprimer définitivement cette campagne ?")) return; state.campaigns = state.campaigns.filter((x) => x.uid !== d.uid); state.drawer = null; state.draft = null; render(); return save("suivi");
    case "newrow": state.draft = { uid: "r" + Date.now() }; state.drawer = "row"; return render();
    case "saver": {
      const r = Object.assign({}, d, { maj: todayISO() });
      state[cfg.key] = state[cfg.key].some((x) => x.uid === r.uid) ? state[cfg.key].map((x) => (x.uid === r.uid ? r : x)) : [r].concat(state[cfg.key]);
      state.drawer = null; state.draft = null; render(); return save(state.tab);
    }
    case "delr": if (!confirm("Supprimer cette ligne du référentiel ?")) return; state[cfg.key] = state[cfg.key].filter((x) => x.uid !== d.uid); state.drawer = null; state.draft = null; render(); return save(state.tab);
    case "import": state.imp = { text: "", mode: "merge" }; return render();
    case "doimport": {
      const res = parseTable(state.imp.text, cfg.cols);
      if (state.imp.mode === "replace" && !confirm("Remplacer les " + state[cfg.key].length + " lignes actuelles par les " + res.rows.length + " lignes importées ? Une version restaurable est conservée.")) return;
      state[cfg.key] = state.imp.mode === "replace" ? res.rows : state.imp.mode === "append" ? res.rows.concat(state[cfg.key]) : mergeRows(state[cfg.key], res.rows, cfg).rows;
      state.imp = null; state.page = 0; render(); return save(state.tab);
    }
    case "secpanel": state.panel = "sec"; return render();
    case "unlock": {
      if (!(await unlock($("#passIn").value))) { state.lockErr = "Code incorrect."; return render(); }
      state.lockErr = ""; return;
    }
    case "setpass": {
      const p1 = prompt("Nouveau code d'accès (aucune récupération possible en cas d'oubli) :");
      if (!p1) return;
      if (p1.length < 4) return alert("Code trop court, 4 caractères minimum.");
      if (prompt("Confirmez le code :") !== p1) return alert("Les deux saisies diffèrent.");
      await setPasscode(p1); armIdle();
      alert("Code enregistré, données chiffrées sur ce poste.\nGardez une sauvegarde à jour : sans le code, elles sont irrécupérables.");
      return render();
    }
    case "delpass":
      if (!confirm("Retirer le code ? Les données redeviendront lisibles sans mot de passe sur ce poste.")) return;
      await removePasscode(); return render();
    case "chooseDir": return Backup.choose();
    case "grantdir": return Backup.grant();
    case "csv": return download(cfg.key + "_" + todayISO() + ".csv", "\uFEFF" + toCSV(state[cfg.key], cfg.cols), "text/csv;charset=utf-8");
    case "backup": {
      const payload = JSON.stringify(exportObj(), null, 1), name = "adops_sauvegarde_" + todayISO() + ".json";
      if (DESKTOP) { await window.desktop.exportFile(name, payload); return; }
      return download(name, payload, "application/json");
    }
    case "restore": {
      if (!DESKTOP) return $("#restoreFile").click();
      const txt = await window.desktop.importFile();
      if (txt) await applyBackup(txt);
      return;
    }
    case "reveal": return window.desktop.reveal();
  }
});

document.addEventListener("input", (e) => {
  const el = e.target, d = state.draft;
  if (el.dataset.set) { state[el.dataset.set === "client" ? "client" : "q"] = el.value.replace(/^Tous les clients$/, "Tous"); state.page = 0; return softRender(); }
  if (el.id === "impText") { state.imp.text = el.value; return render(); }
  if (!d) return;
  if (el.dataset.c) { d[el.dataset.c] = el.value; return refreshStep(); }
  if (el.dataset.r) { d[el.dataset.r] = el.value; return; }
  if (el.dataset.u) { d.utm[el.dataset.u] = el.value; return refreshPrev(); }
  if (el.dataset.lp) { d.lps[+el.dataset.lp].url = el.value; return refreshPrev(); }
  if (el.dataset.note) { d.tasks[el.dataset.note] = Object.assign({ ok: false, at: null }, d.tasks[el.dataset.note], { note: el.value }); return; }
});
document.addEventListener("change", (e) => {
  const el = e.target, d = state.draft;
  if (el.dataset.filter !== undefined) { state.f[el.dataset.filter] = el.value; state.page = 0; return render(); }
  if (el.dataset.set === "client") { state.client = el.value === "Tous les clients" ? "Tous" : el.value; return render(); }
  if (!d) return;
  if (el.dataset.tog) { d[el.dataset.tog] = el.checked; return render(); }
  if (el.dataset.gate) {
    const k = el.dataset.gate, t = d.tasks[k];
    d.tasks[k] = t && t.ok ? Object.assign({}, t, { ok: false, at: null }) : { ok: true, at: todayISO(), note: (t && t.note) || "" };
    return render();
  }
  if (el.dataset.r) d[el.dataset.r] = el.value;
});
function softRender() {
  const s = document.activeElement && document.activeElement.dataset.set;
  render();
  if (!s) return;
  const el = document.querySelector('[data-set="' + s + '"]');
  if (el) { el.focus(); if (el.setSelectionRange) try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
}
function refreshStep() {
  const d = state.draft, box = $("#drawer .step"); if (!box) return;
  const h2 = $("#drawer h2"); if (h2) h2.textContent = lbl(d);
}
function refreshPrev() {
  const d = state.draft;
  document.querySelectorAll("#drawer .prev").forEach((el, i) => (el.value = taggedUrl((d.lps[i] || {}).url, d.utm)));
}

async function applyBackup(txt) {
  try {
    const j = JSON.parse(txt);
    await pushSnapshot();
    if (j.campaigns) { state.campaigns = j.campaigns.map(norm); await Vault.set("campaigns", state.campaigns); }
    if (j.adserver) { state.adserver = j.adserver; await Vault.set("ref_adserver", state.adserver); }
    if (j.adverif) { state.adverif = j.adverif; await Vault.set("ref_adverif", state.adverif); }
    state.snaps = (await Vault.get("snapshots")) || [];
    state.saved = "sauvegarde restaurée"; state.panel = null; render();
  } catch (err) { alert("Fichier de sauvegarde illisible."); }
}
if (document.getElementById("restoreFile")) {
  $("#restoreFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    await applyBackup(await f.text());
    e.target.value = "";
  });
}

document.addEventListener("keydown", (e) => { if (e.key === "Enter" && state.locked && document.activeElement && document.activeElement.id === "passIn") document.querySelector('[data-act="unlock"]').click(); });
boot();

</script>
</body>
</html>
