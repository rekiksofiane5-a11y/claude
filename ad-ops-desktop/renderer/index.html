<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Work</title>
<style>
/* palette tirée du logo My Work (indigo) */
:root{--ink:#1B1C33;--ink2:#51546E;--ink3:#8A8DA6;--page:#F4F4F8;--surf:#fff;--soft:#F6F6FB;--line:#E3E4EE;--bar:#2B2C9E;
  --brand:#4B4ED6;--brand2:#3435B4;--brand-soft:#ECECFC;--blue:var(--brand);--red:#C4314B;--amber:#B26A00;--green:#1B7A5A;
  --rail:68px;--topbar:48px;--shadow:0 1px 2px rgba(27,28,51,.06),0 2px 8px rgba(27,28,51,.04);--shadow-hi:0 6px 22px rgba(52,53,180,.14),0 2px 6px rgba(27,28,51,.06);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;min-height:100vh;background-attachment:fixed;background-color:var(--page);color:var(--ink);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  background-image:radial-gradient(1200px 500px at 110% -10%,#E4E4FB 0,transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surf);border:1px solid var(--line);color:var(--ink2);border-radius:6px;padding:7px 13px;transition:background .15s,border-color .15s,color .15s,transform .08s,box-shadow .15s}
button:hover:not(:disabled){border-color:#C9CADC;color:var(--ink)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.42;cursor:default}
button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.prim{background:linear-gradient(180deg,#5659E0,var(--brand));border-color:var(--brand2);color:#fff;font-weight:600;padding:8px 15px;box-shadow:0 1px 2px rgba(52,53,180,.3)}
button.prim:hover:not(:disabled){color:#fff;box-shadow:0 4px 14px rgba(75,78,214,.35);filter:brightness(1.05)}
button.del{margin-left:auto;color:var(--red)}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-bottom-color:#C9CADC;border-radius:6px;padding:7px 10px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 1px 0 var(--brand),0 0 0 3px rgba(75,78,214,.12)}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#CACBDD;border-radius:9px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:#A9ABC8}

/* ---------- barre de titre, façon Teams ---------- */
#top{position:fixed;inset:0 0 auto 0;height:var(--topbar);z-index:20;display:flex;align-items:center;gap:14px;padding:0 14px 0 12px;color:#fff;
  background:linear-gradient(90deg,#26278F 0,#3A3CC4 55%,#4B4ED6 100%);box-shadow:0 1px 0 rgba(0,0,0,.08),0 2px 10px rgba(38,39,143,.25)}
#logo{height:30px;width:auto;border-radius:7px;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
#logo:hover{transform:rotate(-4deg) scale(1.06)}
#brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
#brand small{font-weight:400;opacity:.75;margin-left:8px;font-size:13px}
.search{flex:0 1 520px;margin:0 auto;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;opacity:.8;pointer-events:none}
.search input{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:6px 12px 6px 34px;transition:background .2s,box-shadow .2s}
.search input::placeholder{color:rgba(255,255,255,.75)}
.search input:hover{background:rgba(255,255,255,.22)}
.search input:focus{background:#fff;color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.18);border-color:#fff}
.search input:focus::placeholder{color:var(--ink3)}
.search input:disabled{opacity:.55}
.search:focus-within svg{color:var(--ink2)}
#tools-right{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.8)}
#status{white-space:nowrap}
#status.pulse{animation:pulse 1.2s var(--ease)}
#tools-right button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff;padding:5px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
#tools-right button:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35);color:#fff}
#tools-right svg{width:14px;height:14px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8B8DF0,#5B5EE0);display:grid;place-items:center;font-weight:700;font-size:12px;box-shadow:0 0 0 2px rgba(255,255,255,.35);position:relative}
.avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#6BB700;box-shadow:0 0 0 2px #4B4ED6}

/* ---------- rail d'applications à gauche ---------- */
#nav{position:fixed;left:0;top:var(--topbar);bottom:0;width:var(--rail);z-index:15;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;
  background:#EBEBF3;border-right:1px solid var(--line)}
.tab{position:relative;width:60px;height:56px;border:none;background:transparent;border-radius:8px;padding:6px 0 4px;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;line-height:1.1}
.tab svg{width:22px;height:22px;transition:transform .25s var(--ease)}
.tab:hover:not(:disabled){background:#fff;color:var(--brand);border:none}
.tab:hover svg{transform:translateY(-1px) scale(1.08)}
.tab::before{content:"";position:absolute;left:-4px;top:50%;width:4px;height:0;border-radius:0 4px 4px 0;background:var(--brand);transform:translateY(-50%);transition:height .25s var(--ease)}
.tab.on{color:var(--brand);font-weight:600;background:#fff;box-shadow:var(--shadow)}
.tab.on::before{height:26px}
.tab.on svg{fill:var(--brand-soft)}
.tab:active:not(:disabled){transform:scale(.94)}

#wrap{margin-left:var(--rail);padding:calc(var(--topbar) + 24px) 28px 64px;max-width:calc(1300px + var(--rail))}
#head{display:flex;align-items:baseline;gap:12px}
#head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.rule{height:3px;width:38px;border-radius:2px;margin:7px 0 18px}
#head + .rule,.rule{background:linear-gradient(90deg,var(--brand),#8B8DF0)!important;animation:grow .5s var(--ease)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.kpis .card{position:relative;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.kpis .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:currentColor;opacity:.0}
.kpis .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.card.pad{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.num{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--ink3)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools select,.tools input{width:auto;min-width:130px}
.tools input[data-set=q]{flex:1 1 160px;max-width:250px}
.seg{margin-left:auto;display:flex;gap:4px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:none;padding:6px 12px;border-radius:6px;background:transparent}
/* bouton sélectionné : toujours foncé avec texte blanc, y compris au survol */
button.on,.seg button.on,button.on:hover:not(:disabled){background:var(--brand);border-color:var(--brand);color:#fff}

/* couleur des campagnes : en ligne = vert pâle, terminée = gris sombre */
.live{--rowbg:#E3F4EA}
.done{--rowbg:#3B4150;color:#F2F4F8}
.row.live,.row.done,tr.live td,tr.done td,.mini.live{background:var(--rowbg)}
.row.live:hover,tr.live:hover td,.mini.live:hover{background:#D3EDDD}
.row.done:hover,tr.done:hover td{background:#454C5D}
.done .sub,.done .m,.done .rt,.done .kv span,.done .al{color:#C7CDD9}
.done .ttl,.done .rt b,.done .kv b{color:#fff}
.done .bar{background:#5A6275}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.badge.live{background:#1B7A5A;color:#fff}
.badge.done{background:#1F2430;color:#fff}
.badge.arch{background:var(--line);color:var(--ink2)}

/* vue Ticket : lignes larges avec toutes les infos */
.tk{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 16px;margin-top:8px;font-size:12.5px}
.kv span{display:block;color:var(--ink3);font-size:11px}
.kv b{font-weight:500;color:var(--ink);word-break:break-word}
.tk .part{margin-top:8px;font-size:12.5px;color:var(--ink2);white-space:pre-line}
.done .tk .part{color:#DDE1E8}

/* menu d'actions d'une campagne */
.dots{padding:2px 9px;font-size:16px;line-height:1.2;border-radius:6px;background:transparent}
.done .dots{color:#fff;border-color:#5A6275}
td.actc{width:1%;text-align:right}
#pop .menu{position:fixed;z-index:40;background:var(--surf);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,26,43,.16);padding:4px;min-width:170px}
#pop .menu button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 12px;color:var(--ink)}
#pop .menu button:hover{background:var(--soft)}
#pop .menu button.del{color:var(--red);margin:0}

/* ---------- effets ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}to{width:38px}}
@keyframes pulse{0%{color:#fff;text-shadow:0 0 0 transparent}30%{color:#D8FFD0;text-shadow:0 0 12px rgba(160,255,140,.8)}100%{text-shadow:0 0 0 transparent}}
.enter #head,.enter #main>*{animation:fadeUp .38s var(--ease) both}
.enter #main>*:nth-child(2){animation-delay:.04s}.enter #main>*:nth-child(3){animation-delay:.08s}.enter #main>*:nth-child(4){animation-delay:.12s}
.enter .row{animation:fadeUp .4s var(--ease) both;animation-delay:calc(.1s + var(--i,0) * 35ms)}
.enter .mini{animation:fadeUp .35s var(--ease) both}
.ov{animation:fadeIn .2s ease both;backdrop-filter:blur(3px)}
.ov aside{animation:slideIn .32s var(--ease) both;box-shadow:-12px 0 40px rgba(27,28,51,.18)}
.ov section{animation:popIn .26s var(--ease) both;box-shadow:0 20px 60px rgba(27,28,51,.25)}
.still .ov,.still .ov aside,.still .ov section{animation:none}
#pop .menu{animation:popIn .16s var(--ease) both;transform-origin:top right}
.row{transition:background .15s,box-shadow .2s var(--ease),transform .2s var(--ease)}
.row:hover{box-shadow:inset 3px 0 0 var(--brand),0 4px 16px rgba(27,28,51,.06);position:relative;z-index:1}
.mini{transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .15s}
.mini:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.seg{background:#EDEDF6;border-color:transparent}
.seg button{transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover:not(.on){background:#fff;color:var(--brand)}
.seg button.on{box-shadow:0 2px 8px rgba(75,78,214,.35)}
.badge.live{animation:livePulse 2.4s ease-in-out infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(27,122,90,.45)}50%{box-shadow:0 0 0 5px rgba(27,122,90,0)}}
.bar i{background:linear-gradient(90deg,var(--brand),#8B8DF0);transition:width .6s var(--ease)}
.dots:hover{background:var(--brand-soft);color:var(--brand);border-color:transparent}
#wrap.locked{margin-left:0;padding-top:24px}
.lklogo{width:120px;height:auto;border-radius:18px;box-shadow:0 12px 30px rgba(52,53,180,.35);margin:0 auto 10px;display:block;animation:popIn .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* onglet Backup */
.bk td{white-space:pre-line;vertical-align:top;min-width:200px}
.bk td:first-child{font-weight:500}
.note{font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.note i{font-style:italic}

.scroll{overflow:auto;max-height:640px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--soft);border-bottom:1px solid var(--line);text-align:left;font-weight:500;font-size:12px;color:var(--ink2);padding:9px 12px;white-space:nowrap;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.b{font-weight:500;max-width:420px;overflow:hidden;text-overflow:ellipsis}
td.m{color:var(--ink2)}td.n{font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.dash{color:var(--ink3)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{color:var(--green);background:#1B7A5A16;border:1px solid #1B7A5A28}
.pill.no{color:var(--red);background:#C33A2E16;border:1px solid #C33A2E28}
.pill.na{color:var(--ink3);background:#8C95A816;border:1px solid #8C95A828}
.pager{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:12px;color:var(--ink2);background:var(--soft);font-variant-numeric:tabular-nums}
.pager button{padding:4px 10px}
.grow{flex:1}

.row{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line);border-left:3px solid var(--line);cursor:pointer}
.card > .row:first-child{border-top:none}
.row:hover{background:var(--soft)}
.row .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .al{font-size:13px;color:var(--ink2);margin-top:3px}
.rt{text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt b{color:var(--ink)}
.prog{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:5px;color:var(--ink3)}
.bar{height:4px;width:64px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch b.s,b.s{font-size:13.5px}
.mini{padding:9px 10px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:7px;margin-bottom:7px;cursor:pointer}
.mini:hover{background:var(--soft)}
.mini .ttl{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .sub{margin:2px 0 5px}
.empty{padding:48px 24px;text-align:center;color:var(--ink2)}
.empty .big{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:6px}
.empty p{max-width:460px;margin:0 auto 18px}
.foot{color:var(--ink3);font-size:12px;margin-top:14px}

.ov{position:fixed;inset:0;background:rgba(20,26,43,.4);display:flex;justify-content:flex-end;z-index:30}
.ov.mid{align-items:center;justify-content:center;padding:20px}
.ov aside{background:var(--surf);width:min(540px,100%);height:100%;overflow-y:auto;padding:24px}
.ov aside.sm{width:min(440px,100%)}
.ov section{background:var(--surf);border-radius:10px;width:min(720px,100%);max-height:90%;overflow-y:auto;padding:22px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ov h2{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:8px 0 4px;word-break:break-word}
.sep{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
dl{display:grid;grid-template-columns:116px 1fr;row-gap:9px;column-gap:12px;font-size:13px;margin:0}
dt{color:var(--ink3);padding-top:7px}dd{margin:0}
.mt{margin-top:14px}
.box{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-top:18px}
.box.soft{background:var(--soft);margin:14px 0}
.step{font-size:17px;font-weight:600;letter-spacing:-.02em}
.chk{display:flex;gap:9px;align-items:center;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--blue);flex:0 0 auto}
.ind{padding-left:24px;margin-top:6px}
.lp{margin-bottom:8px}
.fx{display:flex;gap:6px}
.fx button{padding:6px 10px}
.prev{margin-top:5px;font-size:11.5px;color:var(--ink2);background:var(--soft)}
.alert{border-left:3px solid;padding:7px 11px;margin-bottom:8px;background:var(--soft);border-radius:0 6px 6px 0}
.gate{border-left:3px solid var(--line);padding:9px 0 9px 11px;margin-bottom:6px;border-radius:0 6px 6px 0}
.gate.next{border-left-color:var(--blue);background:var(--soft)}
.gate.done{border-left-color:var(--green)}
.gate.done .gl{color:var(--ink3);text-decoration:line-through}
.gate.next .gl{font-weight:600}
.gate .chk .sub{margin-left:auto;padding-right:4px;white-space:nowrap}
.gate textarea{margin-top:6px;font-size:12.5px;background:#FBFCFD}
.n{font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surf);padding-top:12px;border-top:1px solid var(--line)}
.ov section .acts{position:static;border:none}
/* barre d'actions de la fiche : collée en bas, opaque, rien ne passe dessous */
.ov aside .acts{bottom:-24px;margin-bottom:-24px;padding-bottom:18px;box-shadow:0 -8px 16px -8px rgba(27,28,51,.12);z-index:2}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
@media(max-width:640px){#wrap{padding:18px 12px 48px}dl{grid-template-columns:1fr}dt{padding-top:2px}}

/* sécurité */
.lock{min-height:80vh;display:flex;align-items:center;justify-content:center}
.lockbox{padding:32px;width:min(360px,100%);text-align:center}
.lockbox .lk{font-size:26px}
.lockbox h2{margin:8px 0 4px;font-size:19px;letter-spacing:-.02em}
.lockbox input{margin:16px 0 10px;text-align:center;letter-spacing:.15em}
.lockbox button{width:100%}
.err{color:var(--red);font-size:12.5px;margin-bottom:10px}
.secrow{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.secrow.col{display:block}
.passf{display:grid;gap:8px;margin-top:10px;max-width:360px}
.passf .err{color:var(--red);font-size:12.5px}
.secrow b{font-size:13.5px}
.secrow .sub{margin-top:3px;max-width:430px}
.secrow > div:first-child{flex:1}
.fx.sb{justify-content:space-between;align-items:center}
.snaps{max-height:190px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:7px}
.snap{display:flex;gap:10px;align-items:center;padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
.snap:last-child{border-bottom:none}
.snap .sub{margin-left:auto}
.snap button{padding:3px 9px;font-size:12px}

</style>
</head>

/* ===================== Coffre local : IndexedDB + miroir localStorage + chiffrement ===================== */
const IDB = (() => {
  let db = null;
  const ready = new Promise((res) => {
    if (!window.indexedDB) return res(null);
    const r = indexedDB.open("adops-db", 2);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv", { keyPath: "k" }); };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => res(null);
  });
  return {
    async get(k) {
      await ready;
      if (!db) return null;
      return new Promise((res) => { const rq = db.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result ? rq.result.v : null); rq.onerror = () => res(null); });
    },
    async set(k, v) {
      await ready;
      if (!db) return false;
      return new Promise((res) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put({ k, v }); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    },
    async del(k) { await ready; if (!db) return; const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); },
  };
})();

const ENC = new TextEncoder(), DEC = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)).buffer;
async function deriveKey(pass, salt) {
  const km = await crypto.subtle.importKey("raw", ENC.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: new Uint8Array(salt), iterations: 250000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptVal(key, v) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, ENC.encode(JSON.stringify(v)));
  return { e: 1, iv: Array.from(iv), ct: b64(ct) };
}
async function decryptVal(key, p) {
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(p.iv) }, key, unb64(p.ct));
  return JSON.parse(DEC.decode(buf));
}

const DESKTOP = typeof window !== "undefined" && !!window.desktop;

const Vault = {
  key: null, meta: null,
  async raw(k) {
    if (DESKTOP) return window.desktop.get(k);
    let v = await IDB.get(k);
    if (v == null) { const s = localStorage.getItem("adops_" + k); v = s ? JSON.parse(s) : null; }
    return v;
  },
  async get(k) {
    const v = await this.raw(k);
    if (v && v.e) { if (!this.key) throw new Error("locked"); return decryptVal(this.key, v); }
    return v;
  },
  /* double écriture : la donnée survit à la perte d'un des deux magasins */
  async setRaw(k, payload) {
    if (DESKTOP) return window.desktop.set(k, payload);
    const ok = await IDB.set(k, payload);
    try { localStorage.setItem("adops_" + k, JSON.stringify(payload)); } catch (e) { /* quota */ }
    return ok;
  },
  async set(k, v) {
    if (!this.key && this.meta && this.meta.enc) throw new Error("locked"); /* jamais d'écriture en clair une fois protégé */
    return this.setRaw(k, this.key ? await encryptVal(this.key, v) : v);
  },
};

/* --- versions successives : 20 dernières sauvegardes, restaurables --- */
async function pushSnapshot() {
  let snaps = [];
  try { snaps = (await Vault.get("snapshots")) || []; } catch (e) { snaps = []; }
  snaps.unshift({ t: new Date().toISOString(), campaigns: state.campaigns, adserver: state.adserver, adverif: state.adverif });
  await Vault.set("snapshots", snaps.slice(0, 20));
}

/* ---------- Suivi ---------- */
function enriched() { return state.campaigns.map(norm).map((c) => { const s = stepOf(c); const x = Object.assign({}, c, { s }); x.al = alertsFor(x); return x; }); }

/* en ligne = vert pâle, terminée = gris sombre */

function ticketRow(c, i) {

  return `<div class="row${rowCls(c)}" data-open="${c.uid}" style="border-left-color:${lvlColor(topLvl(c))};--i:${Math.min(i || 0, 12)}"><div class="tk">
    <div class="grow"><div class="ttl">${esc(lbl(c))}${badge(c)}</div>${c.n ? `<div class="sub">${esc(c.n)}</div>` : ""}
      <div class="kv">${kv("Étape", esc(c.s))}${kv("Ticket Issue", esc(c.t || "—"))}${kv("Départ → fin", fmtD(c.d1) + " → " + fmtD(c.d2))}${kv("Régies", esc(c.rg || "—"))}
      ${kv("Taggage", c.tagOn ? esc(c.tagType || "activé") + ((c.lps || []).filter((l) => l.url).length ? " · " + c.lps.filter((l) => l.url).length + " LP" : "") : "non")}
      ${kv("Dernier encours fait", ld ? esc(ld.l) + " · " + fmtD(c.tasks[ld.k].at) : "—")}${kv("Prochain encours", g ? esc(g.l) : "tout est validé")}</div>

}

function viewSuivi() {
  const everything = enriched();
  const clients = ["Tous"].concat(Array.from(new Set(everything.map((c) => c.c).filter(Boolean))).sort());
  const match = (c) => (state.client === "Tous" || c.c === state.client) && (!state.q || (lbl(c) + " " + (c.n || "") + " " + (c.t || "")).toLowerCase().indexOf(state.q.toLowerCase()) >= 0);
  const archived = everything.filter((c) => c.arch && match(c));
  const rows = everything.filter((c) => !c.arch && match(c));
  const bloq = rows.filter((c) => topLvl(c) === 2).length;
  const kpi = [[bloq, "à débloquer", "var(--red)"], [rows.filter((c) => topLvl(c) === 1).length, "à surveiller", "var(--amber)"], [rows.filter((c) => c.s === "En ligne").length, "en ligne", "var(--green)"], [rows.filter((c) => ["Terminée", "Réconciliée"].indexOf(c.s) < 0).length, "ouvertes", "var(--ink)"]];

    body = `<div class="card empty"><div class="big">Aucune campagne pour l'instant</div><p>Créez une campagne avec son client, son nom adserver et son ID agence. L'étape se déduira ensuite des encours cochés.</p><button class="prim" data-act="newc">Ajouter ma première campagne</button></div>`;
  } else if (state.view === "ticket") {
    /* alertes d'abord, puis par date de départ ; les terminées en bas */
    const list = rows.slice().sort((a, b) => isDone(a) - isDone(b) || topLvl(b) - topLvl(a) || String(a.d1 || "9").localeCompare(String(b.d1 || "9")));
    body = `<div class="card">` + (list.length ? list.map((c, i) => ticketRow(c, i)).join("") : `<div class="empty">Aucune campagne ne correspond.</div>`) + `</div>`;
  } else if (state.view === "pipeline") {
    body = `<div class="cols">` + PHASES.map((p) => {
      const list = rows.filter((c) => STEP_PHASE[c.s] === p.key && !isDone(c));
      return `<div class="card pad"><div class="ch"><b>${p.key}</b><span>${list.length}</span></div>` +
        (list.length ? list.map((c) => `<div class="mini${rowCls(c)}" data-open="${c.uid}" style="border-left-color:${lvlColor(topLvl(c))}">
            <div class="ttl s">${esc(lbl(c))}</div><div class="sub">${esc(c.s)} · ${fmtD(c.d1)} → ${fmtD(c.d2)}</div>${bar(doneN(c), gatesFor(c).length)}</div>`).join("") : `<div class="sub">Aucune campagne</div>`) + `</div>`;
    }).join("") + `</div>`;
  } else {
    const list = state.view === "archives" ? archived : rows;
    body = list.length ? `<div class="card"><div class="scroll"><table><thead><tr>${["Campagne", "Étape (calculée)", "Encours", "Départ", "Fin", "Alertes", ""].map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
      list.map((c) => `<tr class="${rowCls(c).trim()}" data-open="${c.uid}"><td class="b">${esc(lbl(c))}</td><td class="m">${esc(c.s)}</td><td><div class="prog">${bar(doneN(c), gatesFor(c).length)}<span>${doneN(c)}/${gatesFor(c).length}</span></div></td><td class="m n">${fmtD(c.d1)}</td><td class="m n">${fmtD(c.d2)}</td><td style="color:${c.al.length ? lvlColor(topLvl(c)) : "inherit"};font-weight:${c.al.length ? 600 : 400}">${c.al.length || "—"}</td><td class="actc">${dots(c)}</td></tr>`).join("") +
      `</tbody></table></div></div>` : `<div class="card empty">${state.view === "archives" ? "Aucune campagne archivée. Archivez une campagne depuis son menu ⋯ pour la retirer des vues sans la supprimer." : "Aucune campagne ne correspond."}</div>`;
  }

  return `${state.campaigns.length ? `<div class="kpis">${kpi.map((k) => `<div class="card pad"><div class="num" style="color:${k[2]}">${k[0]}</div><div class="sub">${k[1]}</div></div>`).join("")}</div>` : ""}
  <div class="tools">
    ${clients.length > 1 ? `<select data-set="client">${clients.map((v) => `<option${v === state.client ? " selected" : ""}>${esc(v === "Tous" ? "Tous les clients" : v)}</option>`).join("")}</select>` : ""}
    <button class="prim" data-act="newc">Ajouter une campagne</button>
    <div class="seg">${[["ticket", "Ticket"], ["pipeline", "Pipeline"], ["liste", "Toutes"], ["archives", "Archivées (" + everything.filter((c) => c.arch).length + ")"]].map((v) => `<button data-view="${v[0]}"${state.view === v[0] ? ' class="on"' : ""}>${v[1]}</button>`).join("")}</div>
  </div>${body}
  <div class="foot">${rows.length} campagne(s) active(s)${archived.length ? " · " + archived.length + " archivée(s)" : ""} · l'étape découle du dernier encours coché.</div>`;
}

/* ---------- Menu d'actions : archiver, dupliquer, supprimer ---------- */
function popMenu() {
  const c = state.campaigns.find((x) => x.uid === state.menu.uid);
  if (!c) return "";
  const left = Math.max(8, Math.min(state.menu.x - 170, window.innerWidth - 186)), top = Math.min(state.menu.y, window.innerHeight - 140);
  return `<div class="menu" style="left:${left}px;top:${top}px">
    <button data-cact="${c.arch ? "unarchive" : "archive"}" data-uid="${c.uid}">${c.arch ? "Désarchiver" : "Archiver"}</button>
    <button data-cact="dup" data-uid="${c.uid}">Dupliquer</button>
    <button class="del" data-cact="del" data-uid="${c.uid}">Supprimer</button></div>`;
}
function campaignAction(act, uid) {
  const c = state.campaigns.find((x) => x.uid === uid);
  state.menu = null;
  if (!c) return render();
  if (act === "del") {
    if (!confirm("Supprimer définitivement « " + lbl(c) + " » ?\nUne version restaurable est conservée dans le panneau Sécurité.")) return render();
    state.campaigns = state.campaigns.filter((x) => x.uid !== uid);
  } else if (act === "archive" || act === "unarchive") {
    state.campaigns = state.campaigns.map((x) => (x.uid === uid ? Object.assign({}, x, { arch: act === "archive", archAt: act === "archive" ? todayISO() : null }) : x));
  } else if (act === "dup") {
    /* même fiche, encours remis à zéro, pour relancer une campagne similaire */
    const copy = Object.assign(JSON.parse(JSON.stringify(c)), { uid: "c" + Date.now(), tasks: {}, arch: false, archAt: null, n: ((c.n || "") + " (copie)").trim() });
    const i = state.campaigns.findIndex((x) => x.uid === uid);
    state.campaigns = state.campaigns.slice(0, i + 1).concat([copy], state.campaigns.slice(i + 1));
    state.draft = norm(JSON.parse(JSON.stringify(copy))); state.drawer = "campaign";
  }
  render();
  return save("suivi");
}

    const gs = gatesFor(c), done = gs.filter((g) => c.tasks[g.k] && c.tasks[g.k].ok), todo = gs.filter((g) => !(c.tasks[g.k] && c.tasks[g.k].ok));

    const info = [
      "Client : " + (c.c || "—"), "Nom adserver : " + (c.a || "—"), "ID agence : " + (c.id || "—"), "Ticket Issue : " + (c.t || "—"),
      "Départ : " + (fmtDay(c.d1) || "—") + " · Fin : " + (fmtDay(c.d2) || "—"), "Étape : " + c.s + " (" + done.length + "/" + gs.length + ")",

}
const BK_HEAD = ["Campagne", "Info", "Déjà effectué", "Reste à effectuer"];

/* ---------- Fichier .xlsx minimal, fabriqué sur place : aucune bibliothèque, aucun réseau ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  const u16 = (v) => [v & 255, (v >>> 8) & 255], u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  files.forEach(([name, text]) => {
    const nm = ENC.encode(name), data = ENC.encode(text), crc = crc32(data);
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0)];
    const local = Uint8Array.from([...u32(0x04034b50), ...common]);
    parts.push(local, nm, data);
    central.push(Uint8Array.from([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += local.length + nm.length + data.length;
  });

  const end = Uint8Array.from([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(off), ...u16(0)]);
  const all = parts.concat(central, [end]), out = new Uint8Array(all.reduce((n, p) => n + p.length, 0));
  let p = 0; all.forEach((a) => { out.set(a, p); p += a.length; });
  return out;
}
function buildXlsx(head, rows, widths, sheetName) {

  const col = (i) => String.fromCharCode(65 + i);
  const row = (r, n, st) => `<row r="${n}">${r.map((v, i) => `<c r="${col(i)}${n}" t="inlineStr" s="${st}"><is><t xml:space="preserve">${x(v)}</t></is></c>`).join("")}</row>`;
  const last = col(head.length - 1) + (rows.length + 1);
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${row(head, 1, 2)}${rows.map((r, i) => row(r, i + 2, 1)).join("")}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`;
  return zipStore([
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(sheetName)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${x(sheetName)}'!$A$1:$${last.replace(/(\d+)$/, "$$$1")}</definedName></definedNames></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF151B2E"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FFDEE1E9"/></left><right style="thin"><color rgb="FFDEE1E9"/></right><top style="thin"><color rgb="FFDEE1E9"/></top><bottom style="thin"><color rgb="FFDEE1E9"/></bottom></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ["xl/worksheets/sheet1.xml", sheet],

}
async function exportXlsx() {

  </div>

  <div class="card"><div class="scroll"><table><thead><tr>${cfg.cols.map((c) => `<th>${c.l}</th>`).join("")}</tr></thead><tbody>` +
    (slice.length ? slice.map((r) => `<tr data-row="${r.uid}">${cfg.cols.map((c, i) => `<td class="${i ? "m" : "b"}${c.t === "date" ? " n" : ""}">${c.t === "tri" ? pill(r[c.k]) : c.t === "date" ? fmtD(r[c.k]) : (esc(r[c.k]) || '<span class="dash">—</span>')}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${cfg.cols.length}" class="empty">Aucune ligne pour ces filtres.</td></tr>`) +
    `</tbody></table></div>
    <div class="pager"><span>${shown.length ? start + 1 : 0} – ${Math.min(start + PER, shown.length)} / ${shown.length}</span>${shown.length !== rows.length ? `<span class="dash">(${rows.length} au total)</span>` : ""}
    <span class="grow"></span><button data-page="-1"${state.page === 0 ? " disabled" : ""}>‹</button><button data-page="1"${start + PER >= shown.length ? " disabled" : ""}>›</button></div>
  </div>`;
}

    ${fld("Départ", inp("d1", "", "date"))}${fld("Fin", inp("d2", "", "date"))}${fld("Régies", inp("rg"))}${fld("Libellé interne", inp("n", "optionnel"))}

    ${al.map((a) => `<div class="alert" style="border-color:${a.lvl === 2 ? "var(--red)" : "var(--amber)"}"><b style="color:${a.lvl === 2 ? "var(--red)" : "var(--amber)"}">${esc(a.r)}</b><div class="sub">${esc(a.t)}</div></div>`).join("")}

    <div class="acts"><button class="prim" data-act="savec">Enregistrer</button><button data-close="cancel">Annuler</button>

      <div class="fx"><span class="pill ${state.backup === "actif" ? "ok" : state.backup === "non configuré" || state.backup === "non disponible" ? "na" : "no"}">${esc(state.backup)}</span>

/* ===================== Événements ===================== */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-tab],[data-view],[data-open],[data-row],[data-act],[data-page],[data-close],[data-mode],[data-dellp],[data-menu],[data-cact]");
  if (t && t.dataset.cact) return campaignAction(t.dataset.cact, t.dataset.uid);
  if (t && t.dataset.menu) {
    const r = t.getBoundingClientRect();
    state.menu = state.menu && state.menu.uid === t.dataset.menu ? null : { uid: t.dataset.menu, x: r.right, y: r.bottom + 4 };
    return render();
  }
  if (state.menu) { state.menu = null; render(); if (!t) return; }
  if (!t) return;
  const d = state.draft;

  if (e.target.classList.contains("ov") || (t.dataset.close !== undefined && t.tagName === "BUTTON")) {
    if (t.dataset.close === "cancel" && state.dirty && !confirm("Abandonner les modifications de cette fiche ?")) return;
    if (t.dataset.close !== "cancel" && state.dirty) return commitDraft();
    if (state.dirty) dropDraft();
    state.drawer = null; state.draft = null; state.imp = null; state.panel = null; state.passForm = false; state.passErr = ""; return render();
  }
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.f = {}; state.q = ""; state.page = 0; return render(); }
  if (t.dataset.view) { state.view = t.dataset.view; return render(); }
  if (t.dataset.page) { state.page = Math.max(0, state.page + (+t.dataset.page)); return render(); }
  if (t.dataset.open) { state.draft = norm(JSON.parse(JSON.stringify(state.campaigns.find((c) => c.uid === t.dataset.open)))); state.drawer = "campaign"; return render(); }
  if (t.dataset.row) { state.draft = Object.assign({}, state[state.tab].find((r) => r.uid === t.dataset.row)); state.drawer = "row"; return render(); }
  if (t.dataset.mode) { state.imp.mode = t.dataset.mode; return render(); }
  if (t.dataset.snap !== undefined) {
    const sn = state.snaps[+t.dataset.snap];
    if (!confirm("Revenir à la version du " + new Date(sn.t).toLocaleString("fr-FR") + " ? L'état actuel est d'abord conservé comme version.")) return;
    await pushSnapshot();
    state.campaigns = sn.campaigns.map(norm); state.adserver = sn.adserver; state.adverif = sn.adverif;
    await Promise.all([Vault.set("campaigns", state.campaigns), Vault.set("ref_adserver", state.adserver), Vault.set("ref_adverif", state.adverif)]);
    state.snaps = (await Vault.get("snapshots")) || []; state.panel = null; render(); return Backup.write(true);
  }
  if (t.dataset.dellp !== undefined) { d.lps.splice(+t.dataset.dellp, 1); touchDraft(); return render(); }

  const cfg = REFS[state.tab];
  switch (t.dataset.act) {
    case "newc": state.draft = norm({ uid: "c" + Date.now(), c: state.client !== "Tous" ? state.client : "", a: "", id: "", d1: "", d2: "", t: "" }); state.drawer = "campaign"; return render();
    case "addlp": d.lps.push({ url: "" }); touchDraft(); return render();
    case "savec": return commitCampaign(d);
    case "delc": if (!confirm("Supprimer définitivement cette campagne ?")) return; state.campaigns = state.campaigns.filter((x) => x.uid !== d.uid); state.drawer = null; state.draft = null; dropDraft(); render(); return save("suivi");
    case "newrow": state.draft = { uid: "r" + Date.now() }; state.drawer = "row"; return render();
    case "saver": return commitRow(d);
    case "delr": if (!confirm("Supprimer cette ligne du référentiel ?")) return; state[cfg.key] = state[cfg.key].filter((x) => x.uid !== d.uid); state.drawer = null; state.draft = null; dropDraft(); render(); return save(state.tab);
    case "import": state.imp = { text: "", mode: "merge" }; return render();
    case "doimport": {
      const res = parseTable(state.imp.text, cfg.cols);
      if (state.imp.mode === "replace" && !confirm("Remplacer les " + state[cfg.key].length + " lignes actuelles par les " + res.rows.length + " lignes importées ? Une version restaurable est conservée.")) return;
      state[cfg.key] = state.imp.mode === "replace" ? res.rows : state.imp.mode === "append" ? res.rows.concat(state[cfg.key]) : mergeRows(state[cfg.key], res.rows, cfg).rows;
      state.imp = null; state.page = 0; render(); return save(state.tab);
    }
    case "secpanel": state.panel = "sec"; return render();
    case "unlock": {
      if (!(await unlock($("#passIn").value))) { state.lockErr = "Code incorrect."; return render(); }
      state.lockErr = ""; return;
    }
    /* saisie dans la fenêtre : prompt() n'existe pas dans l'application de bureau */
    case "setpass": state.passForm = true; state.passErr = ""; render(); return $("#pass1").focus();
    case "nopass": state.passForm = false; state.passErr = ""; return render();
    case "dopass": {
      const p1 = $("#pass1").value, p2 = $("#pass2").value;
      if (p1.length < 4) { state.passErr = "Code trop court, 4 caractères minimum."; render(); return $("#pass1").focus(); }
      if (p1 !== p2) { state.passErr = "Les deux saisies diffèrent."; render(); return $("#pass1").focus(); }
      state.passForm = false; state.passErr = "";
      await setPasscode(p1); armIdle();
      alert("Code enregistré, données chiffrées sur ce poste.\nGardez une sauvegarde à jour : sans le code, elles sont irrécupérables.");
      return render();
    }
    case "delpass":
      if (!confirm("Retirer le code ? Les données redeviendront lisibles sans mot de passe sur ce poste.")) return;
      await removePasscode(); return render();
    case "chooseDir": return Backup.choose();
    case "grantdir": return Backup.grant();
    case "csv": {
      const name = cfg.key + "_" + todayISO() + ".csv", payload = "\uFEFF" + toCSV(state[cfg.key], cfg.cols);
      if (DESKTOP) return window.desktop.exportFile(name, payload);
      return download(name, payload, "text/csv;charset=utf-8");
    }
    case "backup": {
      const payload = JSON.stringify(exportObj(), null, 1), name = "adops_sauvegarde_" + todayISO() + ".json";
      if (DESKTOP) { await window.desktop.exportFile(name, payload); return; }
      return download(name, payload, "application/json");
    }
    case "restore": {
      if (!DESKTOP) return $("#restoreFile").click();
      const txt = await window.desktop.importFile();
      if (txt) await applyBackup(txt);
      return;
    }
    case "reveal": return window.desktop.reveal();
    case "xlsx": return exportXlsx();
    case "archc": d.arch = !d.arch; d.archAt = d.arch ? todayISO() : null; return commitCampaign(d);
  }
});

document.addEventListener("input", (e) => {
  const el = e.target, d = state.draft;
  if (el.dataset.set) { state[el.dataset.set === "client" ? "client" : "q"] = el.value.replace(/^Tous les clients$/, "Tous"); state.page = 0; return softRender(); }
  if (el.id === "impText") { state.imp.text = el.value; return render(); }
  if (!d) return;
  touchDraft();
  if (el.dataset.c) { d[el.dataset.c] = el.value; return refreshStep(); }
  if (el.dataset.r) { d[el.dataset.r] = el.value; return; }
  if (el.dataset.u) { d.utm[el.dataset.u] = el.value; return refreshPrev(); }
  if (el.dataset.lp) { d.lps[+el.dataset.lp].url = el.value; return refreshPrev(); }
  if (el.dataset.note) { d.tasks[el.dataset.note] = Object.assign({ ok: false, at: null }, d.tasks[el.dataset.note], { note: el.value }); return; }
});
document.addEventListener("change", (e) => {
  const el = e.target, d = state.draft;
  if (el.dataset.filter !== undefined) { state.f[el.dataset.filter] = el.value; state.page = 0; return render(); }
  if (el.dataset.set === "client") { state.client = el.value === "Tous les clients" ? "Tous" : el.value; return render(); }
  if (!d) return;
  touchDraft();
  if (el.dataset.tog) { d[el.dataset.tog] = el.checked; return render(); }
  if (el.dataset.gate) {
    const k = el.dataset.gate, t = d.tasks[k];
    d.tasks[k] = t && t.ok ? Object.assign({}, t, { ok: false, at: null }) : { ok: true, at: todayISO(), note: (t && t.note) || "" };
    return render();
  }
  if (el.dataset.r) d[el.dataset.r] = el.value;
});
function softRender() {
  const s = document.activeElement && document.activeElement.dataset.set;
  render();
  if (!s) return;
  const el = document.querySelector('[data-set="' + s + '"]');
  if (el) { el.focus(); if (el.setSelectionRange) try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
}
function refreshStep() {
  const d = state.draft, box = $("#drawer .step"); if (!box) return;
  const h2 = $("#drawer h2"); if (h2) h2.textContent = lbl(d);
}
function refreshPrev() {
  const d = state.draft;
  document.querySelectorAll("#drawer .prev").forEach((el, i) => (el.value = taggedUrl((d.lps[i] || {}).url, d.utm)));
}

async function applyBackup(txt) {
  try {
    const j = JSON.parse(txt);
    await pushSnapshot();
    if (j.campaigns) { state.campaigns = j.campaigns.map(norm); await Vault.set("campaigns", state.campaigns); }
    if (j.adserver) { state.adserver = j.adserver; await Vault.set("ref_adserver", state.adserver); }
    if (j.adverif) { state.adverif = j.adverif; await Vault.set("ref_adverif", state.adverif); }
    state.snaps = (await Vault.get("snapshots")) || [];
    state.saved = "sauvegarde restaurée"; state.panel = null; render();
  } catch (err) { alert("Fichier de sauvegarde illisible."); }
}
if (document.getElementById("restoreFile")) {
  $("#restoreFile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    await applyBackup(await f.text());
    e.target.value = "";
  });
}

const closeMenu = () => { if (state.menu) { state.menu = null; $("#pop").innerHTML = ""; } };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("scroll", closeMenu, true);
window.addEventListener("resize", closeMenu);
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && document.activeElement && /^pass[12]$/.test(document.activeElement.id)) document.querySelector('[data-act="dopass"]').click(); });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && state.locked && document.activeElement && document.activeElement.id === "passIn") document.querySelector('[data-act="unlock"]').click(); });
if (DESKTOP && window.desktop.onFlush) window.desktop.onFlush(commitDraft);
