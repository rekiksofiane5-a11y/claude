name: ad-ops-desktop

on:
  push:
    paths: ["ad-ops-desktop/**", ".github/workflows/ad-ops-desktop.yml"]
  pull_request:
    paths: ["ad-ops-desktop/**", ".github/workflows/ad-ops-desktop.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ad-ops-desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ad-ops-desktop/package-lock.json }
      - run: npm ci
      - run: xvfb-run -a npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ad-ops-desktop/package-lock.json }
      - run: npm ci
      - run: npm run build:win
      - name: Version sans installation, version HTML et empreintes SHA-256
        shell: pwsh
        run: |
          Move-Item dist/win-unpacked "dist/Suivi ad ops"
          Copy-Item build/LISEZ-MOI.txt "dist/Suivi ad ops/LISEZ-MOI.txt"
          Copy-Item renderer/index.html dist/Suivi-ad-ops-navigateur.html
          Copy-Item DSI.md dist/DSI.md
          $files = @(Get-ChildItem dist/* -File -Include *.exe,*.msi,*.html | ForEach-Object Name) + "Suivi ad ops/Suivi ad ops.exe"
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash "dist/$_" -Algorithm SHA256).Hash.ToLower(), $_ } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      # Prêt à l'emploi : on décompresse et on double-clique, sans installation
      - uses: actions/upload-artifact@v4
        with:
          name: Suivi-ad-ops-pret-a-l-emploi
          path: ad-ops-desktop/dist/Suivi ad ops/
          if-no-files-found: error
      # Pour la DSI : installeurs, version navigateur, empreintes et fiche technique
      - uses: actions/upload-artifact@v4
        with:
          name: Suivi-ad-ops-installeurs-et-DSI
          path: |
            ad-ops-desktop/dist/*.exe
            ad-ops-desktop/dist/*.msi
            ad-ops-desktop/dist/Suivi-ad-ops-navigateur.html
            ad-ops-desktop/dist/SHA256SUMS.txt
            ad-ops-desktop/dist/DSI.md
          if-no-files-found: error
