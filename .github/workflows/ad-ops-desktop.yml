name: ad-ops-desktop

on:
  push:
    paths: ["ad-ops-desktop/**", ".github/workflows/ad-ops-desktop.yml"]
  pull_request:
    paths: ["ad-ops-desktop/**", ".github/workflows/ad-ops-desktop.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ad-ops-desktop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ad-ops-desktop/package-lock.json }
      - run: npm ci
      - run: xvfb-run -a npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ad-ops-desktop/package-lock.json }
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Suivi-ad-ops-Windows
          path: ad-ops-desktop/dist/*.exe
          if-no-files-found: error
